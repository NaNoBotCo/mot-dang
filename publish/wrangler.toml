# The site Worker. Separate from worker/ (mot-dang-claims) on purpose: that one
# holds owner claims in KV and must not be redeployed every time a page changes.
#
# FIRST TIME
#   cd publish
#   npx wrangler r2 bucket create mot-dang-site
#   npx wrangler deploy
#   # then in the dashboard: Workers > mot-dang-site > Settings > Domains
#   # add motdang.net and www.motdang.net (the zone is already on Cloudflare,
#   # which is what makes a custom domain possible here at all)
#
# EVERY DEPLOY AFTER THAT is just content — python3 publish/deploy.py — and does
# not touch this Worker at all. The Worker only changes when routing does.
#
# LOCAL TEST, no account needed:
#   npx wrangler dev --local
#   # --local gives a simulated R2 on disk; seed it with
#   #   npx wrangler r2 object put mot-dang-site/index.html --file=../docs/index.html --local

name = "mot-dang-site"
main = "worker.js"
compatibility_date = "2026-07-01"

# Binding name must stay SITE — worker.js reads env.SITE. Same gotcha the
# claims worker documents: wrangler's suggested snippet names the binding after
# the resource, which compiles and then 500s on an undefined binding.
[[r2_buckets]]
binding = "SITE"
bucket_name = "mot-dang-site"

# The edge count (Nan's decision 2026-09-05, arrivals note A1). One row per
# request, written from inside this Worker — see the block at the foot of
# worker.js for what a row holds and what it deliberately leaves out.
#
# The dataset is traffic-eye's, on purpose: that project already collects the
# same eight blobs for the other sites and already has a dashboard over them.
# A route could not be used here — motdang.net/* belongs to this Worker — so
# the classifier is vendored into publish/classify.js instead.
#
# The dataset is created on first write; nothing to set up beyond having
# Analytics Engine enabled on the account, which it is (traffic_eye exists).
#
# Binding name must stay TRAFFIC — worker.js reads env.TRAFFIC. If it is
# missing the Worker still serves every page and simply records nothing.
[[analytics_engine_datasets]]
binding = "TRAFFIC"
dataset = "traffic_eye"

# The fleet search index (fleetsearch/README.md): every page of every site on
# the roster, in FTS5. Filled by `python3 fleetsearch/load.py --remote` — a
# content step, like deploy.py; the Worker only changes when the query or the
# page does. Binding name must stay SEARCH — fleetsearch.js reads env.SEARCH.
# Without it /find answers 503 and every other path serves as before.
[[d1_databases]]
binding = "SEARCH"
database_name = "motdang-search"
database_id = "abec2f32-1958-413f-b05c-02c40af65f1d"

# The meaning half of /find (publish/findmeaning.js): the query embedded with
# bge-m3 on Workers AI, matched against every page in the Vectorize index
# motdang-find (filled by `python3 fleetsearch/embed.py`). Without either
# binding /find is the word search alone.
[ai]
binding = "AI"

[[vectorize]]
binding = "FIND_VEC"
index_name = "motdang-find"

# The live site. Declared here rather than clicked in the dashboard so the
# domain binding is recorded in the repo — if this Worker ever has to be
# rebuilt from scratch, the hostname comes back with it.
#
# A hostname belongs to exactly one Cloudflare service, so these were detached
# from the `motdang` Pages project first (2026-08-12). Pages had been serving
# the site from a GitHub-connected build that stopped updating when the account
# was suspended.
# ROUTES, not custom_domain. A custom domain asks Cloudflare to create and own
# the DNS record, and it refuses when a record already exists — which it does
# here, left behind by the Pages setup. A route instead intercepts requests to
# a hostname that is ALREADY proxied through Cloudflare, which those records
# are. Same result, no DNS surgery, and it works with records this account's
# deploy token cannot edit.
[[routes]]
pattern = "motdang.net/*"
zone_name = "motdang.net"

[[routes]]
pattern = "www.motdang.net/*"
zone_name = "motdang.net"
