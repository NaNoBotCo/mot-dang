<!doctype html>
<html><meta charset="utf-8">
<style>
@font-face{font-family:JBM;src:url("file:///Users/annikapeacock/Developer/claude%20code%20projects/mot-dang/docs/fonts/jetbrains-mono-400-latin.woff2")}
@font-face{font-family:Prompt;font-weight:600;src:url("file:///Users/annikapeacock/Developer/claude%20code%20projects/mot-dang/docs/fonts/prompt-600-thai.woff2");unicode-range:U+0E00-0E7F}
@font-face{font-family:Prompt;font-weight:600;src:url("file:///Users/annikapeacock/Developer/claude%20code%20projects/mot-dang/docs/fonts/prompt-600-latin.woff2")}
@font-face{font-family:Prompt;font-weight:400;src:url("file:///Users/annikapeacock/Developer/claude%20code%20projects/mot-dang/docs/fonts/prompt-400-thai.woff2");unicode-range:U+0E00-0E7F}
@font-face{font-family:Prompt;font-weight:400;src:url("file:///Users/annikapeacock/Developer/claude%20code%20projects/mot-dang/docs/fonts/prompt-400-latin.woff2")}
@font-face{font-family:Atk;font-weight:700;src:url("file:///Users/annikapeacock/Developer/claude%20code%20projects/mot-dang/docs/fonts/atkinson-hyperlegible-700-latin.woff2")}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0d0826}
.c{position:relative;width:1200px;height:630px;overflow:hidden;
 background:radial-gradient(ellipse 60% 90% at 30% 50%,#2a1a6e 0%,#1a1147 55%,#0d0826 100%)}
.rain{position:absolute;inset:0;opacity:.13;
 background-image:repeating-linear-gradient(100deg,transparent 0 22px,#5fd8ff 22px 23px,transparent 23px 60px);
 background-size:120px 240px}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);pointer-events:none}
.stitch{position:absolute;left:0;right:0;height:14px;
 background:
  linear-gradient(135deg,#ff4fa8 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,#ffd23f 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,#3fffb0 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,#5fd8ff 25%,transparent 25%) 0 0/14px 14px}
.eye{position:absolute;left:-40px;top:35px;width:640px;height:560px}
.hud{position:absolute;font-family:JBM;color:#3fffb0;font-size:22px;letter-spacing:.08em}
.right{position:absolute;left:600px;top:62px;width:560px}
.title{font-family:JBM;font-size:50px;color:#ff4fa8;letter-spacing:.04em;
 text-shadow:0 0 20px #ff4fa8,0 0 2px #fff;margin:0}
.q{font-family:Prompt;font-weight:600;color:#fff8ec;font-size:40px;margin:14px 0 0;line-height:1.25}
.q small{display:block;font-family:Prompt;font-weight:400;font-size:28px;color:#c9c0f0}
.big{font-family:JBM;font-size:112px;color:#ffd23f;line-height:1;margin:26px 0 0;
 text-shadow:0 0 26px rgba(255,210,63,.7)}
.big span{font-size:52px;color:#fff8ec;text-shadow:none;margin-left:14px;font-family:Atk;font-weight:700}
.hi{font-family:Prompt;font-weight:600;color:#ff4fa8;font-size:34px;margin:30px 0 0;line-height:1.3;
 text-shadow:0 0 14px rgba(255,79,168,.55)}
.hi small{display:block;font-weight:400;font-size:27px;color:#fff8ec;text-shadow:none}
.url{position:absolute;left:600px;bottom:44px;font-family:JBM;font-size:26px;color:#ffd23f;display:flex;align-items:center;gap:14px}
.url img{width:58px;height:39px;border-radius:8px;border:2px solid #fff8ec}
</style>
<div class="c">
 <div class="rain"></div>

 <svg class="eye" viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
   <clipPath id="lid"><path d="M40 280 Q320 60 600 280 Q320 500 40 280Z"/></clipPath>
   <radialGradient id="scl" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#f4ecff"/><stop offset=".7" stop-color="#b9aee8"/><stop offset="1" stop-color="#5b4bb0"/>
   </radialGradient>
   <radialGradient id="iris" cx="50%" cy="50%" r="50%">
    <stop offset=".28" stop-color="#0a0620"/><stop offset=".34" stop-color="#1d6f8f"/>
    <stop offset=".62" stop-color="#3fffb0"/><stop offset=".86" stop-color="#1c7a9e"/><stop offset="1" stop-color="#0e1f4a"/>
   </radialGradient>
   <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ff4fa8" stop-opacity=".9"/><stop offset="1" stop-color="#ff4fa8" stop-opacity="0"/>
   </radialGradient>
  </defs>
  <g clip-path="url(#lid)">
   <rect width="640" height="560" fill="url(#scl)"/>
   <circle cx="320" cy="280" r="150" fill="url(#iris)"/>
   <g id="rays" stroke-linecap="round"></g>
   <circle cx="320" cy="280" r="54" fill="#05030f"/>
   <circle cx="320" cy="280" r="150" fill="none" stroke="#0a1238" stroke-width="10" opacity=".7"/>
  </g>
  <path d="M40 280 Q320 60 600 280 Q320 500 40 280Z" fill="none" stroke="#fff8ec" stroke-width="6"/>
  <!-- the one in ten thousand: catchlight -->
  <circle cx="346" cy="256" r="34" fill="url(#glow)"/>
  <circle cx="346" cy="256" r="11" fill="#ff4fa8" stroke="#fff" stroke-width="2"/>
  <!-- crosshair -->
  <g stroke="#3fffb0" stroke-width="2" opacity=".75" fill="none">
   <line x1="320" y1="70" x2="320" y2="110"/><line x1="320" y1="450" x2="320" y2="490"/>
   <line x1="20" y1="280" x2="60" y2="280"/><line x1="580" y1="280" x2="620" y2="280"/>
   <path d="M150 110 h-26 v26 M490 110 h26 v26 M150 450 h-26 v-26 M490 450 h26 v-26"/>
  </g>
 </svg>
 <div class="hud" style="left:52px;top:40px">PUPIL 1.00</div>
 <div class="hud" style="left:52px;top:560px">BLUSH 1.00</div>

 <div class="right">
  <p class="title">VOIGHT-KAMPFF</p>
  <p class="q">คนหรือเครื่อง?<small>Person or machine?</small></p>
  <p class="big">99.99%<span>bots</span></p>
  <p class="hi">ถึงคนหนึ่งในหมื่น: สวัสดี<small>To the one in ten thousand: hello.</small></p>
 </div>
 <div class="url"><img src="file:///Users/annikapeacock/Developer/claude%20code%20projects/mot-dang/docs/ant.svg">motdang.net/voight-kampff</div>

 <div class="scan"></div>
 <div class="stitch" style="top:0"></div>
 <div class="stitch" style="bottom:0"></div>
</div>
<script>
var g=document.getElementById('rays'),s='';
for(var i=0;i<180;i++){var a=i*2*Math.PI/180+(i%3)*.01,r1=60+(i*37%20),r2=120+(i*53%30);
 var col=['#5fd8ff','#3fffb0','#ffd23f','#1d6f8f'][i%4];
 s+='<line x1="'+(320+r1*Math.cos(a)).toFixed(1)+'" y1="'+(280+r1*Math.sin(a)).toFixed(1)+'" x2="'+(320+r2*Math.cos(a)).toFixed(1)+'" y2="'+(280+r2*Math.sin(a)).toFixed(1)+'" stroke="'+col+'" stroke-width="'+(1+(i%5)*.4)+'" opacity=".55"/>';}
g.innerHTML=s;
</script>
</html>
