<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>มดแดง — ห้องน้ำใกล้ฉัน</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="ribbon">
  <div class="brand">
    <span class="ant-dot">🐜</span>
    <div class="brand-words">
      <b>ห้องน้ำใกล้ฉัน</b>
      <small>มดแดง · Mot Dang</small>
    </div>
  </div>
  <div class="ribbon-actions">
    <button id="btn-mylog" class="chip-btn" title="บันทึกของฉัน">🗂️</button>
    <button id="btn-privacy" class="chip-btn" title="ความเป็นส่วนตัว">🕊️</button>
  </div>
</header>

<div id="map-wrap">
  <canvas id="map"></canvas>
  <div class="map-controls">
    <button id="btn-zoom-in" class="round-btn" aria-label="ซูมเข้า">＋</button>
    <button id="btn-zoom-out" class="round-btn" aria-label="ซูมออก">－</button>
    <button id="btn-locate" class="round-btn locate" aria-label="ตำแหน่งของฉัน">📍</button>
  </div>
  <div id="attribution">แผนที่ในเครื่อง · ข้อมูล © OpenStreetMap contributors (ODbL)</div>
</div>

<section id="sheet" class="sheet">
  <div class="sheet-handle" id="sheet-handle"><span></span></div>
  <div id="sheet-body">
    <div id="near-head" class="near-head">
      <b>ที่ใกล้ที่สุดก่อน</b> <small>· nearest first</small>
      <span id="near-from" class="near-from"></span>
    </div>
    <ol id="near-list" class="near-list"></ol>
  </div>
</section>

<div id="card-veil" class="veil" hidden></div>
<article id="card" class="card" hidden></article>

<article id="page" class="page" hidden></article>

<div id="toast" class="toast" hidden></div>

<script src="data/basemap.js"></script>
<script src="data/landmarks.js"></script>
<script src="data/toilets.js"></script>
<script src="data/toilets-customers.js"></script>
<script src="app.js"></script>
</body>
</html>
